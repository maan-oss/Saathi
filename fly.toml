# Fly.io alternative:  fly launch --no-deploy --copy-config ; fly volumes create saathi_data --size 1 --region bom ;
#                      fly secrets import < .env ; fly deploy
app = "saathi-change-me"
primary_region = "bom"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "3000"
  TRUST_PROXY = "1"

[mounts]
  source = "saathi_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # reminders run inside the server, so it must stay on
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
